version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orsee-web
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=orsee_db
      - DB_USER=orsee_user
      - DB_PASSWORD=orsee_pw
      - ORSEE_SERVER_URL=localhost:8080
      - ORSEE_SERVER_PROTOCOL=http://
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: orsee-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=orsee_db
      - MYSQL_USER=orsee_user
      - MYSQL_PASSWORD=orsee_pw
      - MYSQL_ROOT_PASSWORD=orsee_root_pw
    volumes:
      - db-data:/var/lib/mysql
      - ./install/install.sql:/docker-entrypoint-initdb.d/install.sql
    ports:
      - "3306:3306"

volumes:
  db-data:
